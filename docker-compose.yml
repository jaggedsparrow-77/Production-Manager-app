services:
  db:
    image: postgres:18-alpine
    container_name: callboard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: callboard
    ports:
      # 5433 on the host so this never collides with a local Postgres on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d callboard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
